<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, height=device-height, interactive-widget=resizes-visual" />
		<link rel="icon" href="/assets/favicon.png" type="image/png" />
		<meta name="twitter:card" content="summary" />
		<title>Diário de Deus</title>
		<style>
			html, body { background : #0C0B0E; color : #E8E2D6; }
			.telaDeErro { max-width : 600px; padding : 40px 20px; margin : 0 auto; font-family : sans-serif; }
			.telaDeErro button { padding : 10px 16px; font-size : 15px; color : #FFFFFF; cursor : pointer; background : #C2152F; border : none; border-radius : 6px; }
			.telaDeErro pre { padding : 12px; overflow : auto; background : #1C1921; white-space : pre-wrap; }
		</style>
	</head>
	<body>
		<main id="reactRoot"></main>
		<script type="module">
  			const props = window.__INITIAL_PROPS__ || {};
			const url = props.config?.baseUrl;
			const title = props.brew?.title;

  			let prefix = '';

			// Default page title
			let result ='Diário de Deus';

			// Add brew title, if it exists
			if (title) {
  				result = `${title} - ${result}`;
  			}

			// Add prefix for Stage/PR Deployment/Local install
  			if (url && url?.includes('://homebrewery-stage.')) {
  				prefix = `Stage `;
  			} else if (url?.includes('://homebrewery-pr-')) {
  				const match = url.match(/pr-(\d+)/);
  				if (match) prefix = `PR-${match[1]} `;
  			} else if (url?.includes('://localhost')) {
  				prefix = 'Local ';
  			}

			if (prefix) {
				result = `${prefix} - ${result}`;
			}

			// Set page title
			document.title = result;

			if (window.location.pathname.startsWith('/admin')) {
				import('/client/admin/main.jsx');
			} else {
				import('/client/homebrew/main.jsx');
			}
		</script>
	</body>
</html>
